<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Pagination</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class='container mt-4 text-center'>
<ul class='pagination justify-content-center'><li class='page-item'><a class='page-link'>Prev</a></li><li class='page-item'><a class='page-link'>1</a></li><li class='page-item'><a class='page-link'>2</a></li><li class='page-item'><a class='page-link'>Next</a></li></ul>
<button class='btn btn-outline-secondary me-2'>Older Posts</button>
<button class='btn btn-outline-secondary'>Newer Posts</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
