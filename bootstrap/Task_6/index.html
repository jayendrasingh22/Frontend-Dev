<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class='container mt-4'>
<div class='card p-3'>

<div class='alert alert-danger alert-dismissible fade show'>Warning alert<button class='btn-close' data-bs-dismiss='alert'></button></div>
<div class='bg-light p-3 border mt-3'>Summary well content.</div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
