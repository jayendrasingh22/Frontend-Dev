<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class='container text-center mt-4'>
<h2>Tasks <span class='badge bg-danger'>5</span></h2></header>
<main class='container mt-3'>
<ul class='list-group'>
<li class='list-group-item d-flex justify-content-between'>Task 1 <span class='badge bg-danger'>High</span></li>
<li class='list-group-item d-flex justify-content-between'>Task 2 <span class='badge bg-warning'>Medium</span></li>
<li class='list-group-item d-flex justify-content-between'>Task 3 <span class='badge bg-success'>Low</span></li>
</ul>
<button class='btn btn-primary mt-3'>Completed <span class='badge bg-light text-dark'>3</span></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
