<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Agency Showcase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class='container mt-4'>
<div id='carouselExample' class='carousel slide' data-bs-ride='carousel'>
<div class='carousel-inner'>
<div class='carousel-item active' data-bs-interval='2000'><img src='https://via.placeholder.com/800x300' class='d-block w-100'><div class='carousel-caption'><h3>Paris</h3></div></div>
<div class='carousel-item' data-bs-interval='2000'><img src='https://via.placeholder.com/800x300' class='d-block w-100'><div class='carousel-caption'><h3>Bali</h3></div></div>
<div class='carousel-item' data-bs-interval='2000'><img src='https://via.placeholder.com/800x300' class='d-block w-100'><div class='carousel-caption'><h3>Tokyo</h3></div></div>
</div>
</div>
<div class='progress mt-4'><div class='progress-bar progress-bar-striped progress-bar-animated' style='width:70%'>70%</div></div>
<footer class='text-center mt-4 p-3 bg-dark text-white'>Contact us</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
