<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Switcher</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="container">
  <h1>Theme Switcher</h1>
  <div>
    <button data-theme="light">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="blue">Blue</button>
  </div>
  <p>Current theme is stored in <code>data-theme</code> attribute on body.</p>
</main>
<script src="script.js"></script>
</body></html>
