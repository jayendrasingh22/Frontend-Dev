<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Step Form</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="container">
  <h1>Multi-Step Form</h1>
  <form id="msForm">
    <div class="step" data-step="1"><label>Name: <input name="name" required></label></div>
    <div class="step" data-step="2" style="display:none"><label>Email: <input name="email" required></label></div>
    <div class="step" data-step="3" style="display:none"><label>Password: <input name="password" type="password" required></label></div>
    <div class="controls">
      <button type="button" id="back">Back</button>
      <button type="button" id="next">Next</button>
    </div>
  </form>
  <div id="summary" style="margin-top:10px"></div>
</main>
<script src="script.js"></script>
</body></html>
