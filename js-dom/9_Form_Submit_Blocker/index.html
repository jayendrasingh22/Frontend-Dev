<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Submit Blocker</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="container">
  <h1>Form</h1>
  <form id="f">
    <div><label>Name: <input name="name"></label><span class="err"></span></div>
    <div><label>Email: <input name="email"></label><span class="err"></span></div>
    <div><label>Password: <input name="password" type="password"></label><span class="err"></span></div>
    <button type="submit">Submit</button>
  </form>
  <div id="msg"></div>
</main>
<script src="script.js"></script>
</body></html>
