<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Dropdown</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="container">
  <h1>Custom Dropdown</h1>
  <div class="dropdown" id="dd">
    <button id="ddBtn">Select an option</button>
    <ul id="options" class="options" style="display:none">
      <li data-value="1">Option 1</li>
      <li data-value="2">Option 2</li>
      <li data-value="3">Option 3</li>
    </ul>
  </div>
</main>
<script src="script.js"></script>
</body></html>
