<!DOCTYPE html>
<!-- Task 3: Course Registration Form (HTML only) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Course Registration Form</title>
</head>
<body>
  <header>
    <h1>Course Registration</h1>
  </header>

  <main>
    <form action="#" method="post">
      <fieldset>
        <legend>Student Details</legend>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" title="Enter your full name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" title="Enter your email address" required><br><br>
      </fieldset>

      <fieldset>
        <legend>Course Selection</legend>
        <label for="course">Choose a course:</label><br>
        <select id="course" name="course">
          <option value="cs101" selected>CS101 - Introduction to Programming</option>
          <option value="web">WEB201 - Web Development</option>
          <option value="ml">ML301 - Machine Learning Basics</option>
        </select>
      </fieldset>

      <p><input type="submit" value="Register"></p>
    </form>

    <h2>Available Course Schedules</h2>
    <table border="1" cellpadding="4" cellspacing="0" title="Course schedules">
      <thead>
        <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
      </thead>
      <tbody>
        <tr><td>Monday</td><td>10:00 - 12:00</td><td>Dr. A</td></tr>
        <tr><td>Wednesday</td><td>14:00 - 16:00</td><td>Ms. B</td></tr>
        <tr><td>Friday</td><td>09:00 - 11:00</td><td>Mr. C</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Registration Form - Assignment</p>
  </footer>
</body>
</html>
